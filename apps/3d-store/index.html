<!doctype html>
<html lang="bn" style="--accent: {{STORE_COLOR}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="{{STORE_COLOR}}" />
    <meta name="description" content="{{STORE_NAME}} — {{STORE_TAGLINE}}" />
    <title>{{STORE_NAME}} · 3D Store</title>
    <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
    <style>
      /* Loading screen is inline so it paints before any JS or CSS file arrives (hook #1). */
      @font-face {
        font-family: 'Noto Sans Bengali';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/noto-sans-bengali-var.woff2') format('woff2');
        unicode-range: U+0964-0965, U+0980-09FE, U+200C-200D, U+20B9, U+25CC;
      }
      html, body { margin: 0; height: 100%; background: #f4efe8; }
      body { font-family: 'Noto Sans Bengali', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #1f1d1a; }
      #loader {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans Bengali', sans-serif;
        position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px; background: #f4efe8;
        transition: opacity .45s ease; text-align: center; padding: 0 24px;
      }
      #loader.hide { opacity: 0; pointer-events: none; }
      #loader .mark { width: 72px; height: 72px; border-radius: 20px; background: var(--accent); display: grid; place-items: center; }
      #loader .mark svg { width: 44px; height: 44px; }
      #loader h1 { margin: 6px 0 0; font-size: 28px; letter-spacing: .5px; font-weight: 700; }
      #loader .tag { margin: 0; font-size: 15px; color: #5c5750; }
      #loader .bar { width: min(260px, 70vw); height: 6px; border-radius: 6px; background: #e3dbcf; overflow: hidden; margin-top: 10px; }
      #loader .bar i { display: block; height: 100%; width: 12%; background: var(--accent); border-radius: 6px; transition: width .35s ease; animation: pulse 1.2s ease-in-out infinite alternate; }
      @keyframes pulse { from { opacity: .7 } to { opacity: 1 } }
      #loader .line { font-size: 17px; margin-top: 4px; }
      @media (prefers-reduced-motion: reduce) { #loader .bar i { animation: none; } }
    </style>
  </head>
  <body>
    <div id="loader" role="status" aria-live="polite" aria-label="দোকান খুলছে">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 30 32 12l22 18" /><path d="M18 28v22h28V28" /><path d="M26 50V38h12v12" />
        </svg>
      </div>
      <h1>{{STORE_NAME}}</h1>
      <p class="tag">{{STORE_TAGLINE}}</p>
      <div class="bar"><i id="loaderBar"></i></div>
      <p class="line">দোকান খুলছে…</p>
    </div>

    <a class="skip" href="#fallback">product list-এ যান</a>

    <header id="topbar" aria-label="উপরের বার">
      <a class="brand" href="/" aria-label="{{STORE_NAME}}">
        <img src="{{STORE_LOGO}}" alt="" width="36" height="36" />
      </a>
      <div class="store-name" id="storeName">{{STORE_NAME}}</div>
      <div class="top-actions">
        <button id="viewToggle" class="chip" type="button" aria-pressed="false">সাধারণ view</button>
        <button id="cartBtn" class="chip cart" type="button" aria-label="ব্যাগ">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l1 14H5z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/></svg>
          <span id="cartCount" class="count" hidden>0</span>
        </button>
      </div>
    </header>

    <main id="app">
      <canvas id="scene" tabindex="0" aria-label="শপের ভেতরে ঘুরে দেখার জায়গা"></canvas>

      <section id="fallback" hidden aria-label="সব product"></section>

      <nav id="pills" aria-label="শপের section" hidden></nav>

      <aside id="strip" hidden aria-label="এই section-এর অন্য product"></aside>

      <aside id="panel" role="dialog" aria-modal="false" aria-labelledby="panelTitle" hidden></aside>

      <div id="coach" hidden role="note">
        <p>আঙুল দিয়ে ঘুরে দেখুন<br />product-এ ট্যাপ করুন</p>
        <button type="button" id="coachOk">বুঝেছি</button>
      </div>

      <aside id="cartSheet" role="dialog" aria-modal="true" aria-labelledby="cartTitle" hidden></aside>
      <div id="scrim" hidden></div>
      <div id="toast" role="status" aria-live="polite" hidden></div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
